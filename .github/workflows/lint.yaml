# .github/workflows/lint.yaml

# 1. Name of the workflow
name: Python Linter

# 2. When to trigger the workflow
on:
  # Triggered on push to "all" branches
  push:

  pull_request:
    branches: [ "main", "master", "develop" ] # When a pull request is created for the main branches

# 3. Define the jobs to be executed
jobs:
  ruff-lint:
    # Name of the job
    name: Run Ruff Linter
    # The virtual machine environment where the job will run
    runs-on: ubuntu-latest

    # Steps of the job
    steps:
      # Step 1: Get your code
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10" # Setting python version to 3.10
          cache: 'pip' # Cache pip's installed packages to speed up subsequent runs

      # Step 3: Install ruff
      # ruff is a static analyzer and does not need the project's runtime deps
      # installed; we skip `pip install -e .` (no pyproject.toml in repo anyway).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.12.12

      # Step 4: Run ruff check
      # --output-format=github can directly annotate issues in a Pull Request
      - name: Run ruff check
        run: |
          ruff check . --output-format=github

      # (Optional) Step 5: Check code format
      # --check only checks if the format is correct, it does not actually modify the files
      - name: Run ruff format check
        run: |
          ruff format . --check