services:
  # ============================================
  # Scraper Services (依更新頻率分類)
  # ============================================

  # 每日行情 (交易日執行)
  scraper-daily:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    volumes:
      - ./data:/app/data
    environment:
      - OUTPUT_DIR=/app/data
      - MARKET_TYPE=${MARKET_TYPE:-ALL}
      - START_DATE=${START_DATE}
      - END_DATE=${END_DATE}
      - FETCH_DELAY=${FETCH_DELAY:-3.0}

  # 集保股權分散表 (每週五執行)
  scraper-weekly:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    volumes:
      - ./data:/app/data
    command: python fetch_tdcc_history.py -f active_stocks.txt -d ${TDCC_DATE}
    environment:
      - OUTPUT_DIR=/app/data

  # 月營收 (每月 10 日後執行)
  scraper-monthly:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    volumes:
      - ./data:/app/data
    command: python fetch_monthly_revenue.py --year ${REVENUE_YEAR} --month ${REVENUE_MONTH}
    environment:
      - OUTPUT_DIR=/app/data

  # ============================================
  # Processor & Importer
  # ============================================

  processor:
    build: 
      context: ./processor
    volumes:
      - ./data:/app/data
    environment:
      - START_DATE=${START_DATE}
      - END_DATE=${END_DATE}

  importer:
    build:
      context: ./importer
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=stock_db
      - START_DATE=${START_DATE}
      - END_DATE=${END_DATE}

  calculator:
    build: ./calculator
    container_name: ${PROJECT_NAME}-calculator
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_HOST=db
      - START_DATE=${START_DATE}
      - END_DATE=${END_DATE}
    volumes:
      - ./calculator:/app
    depends_on:
      db:
        condition: service_healthy

  backtester:
    build: 
      context: .
      dockerfile: backtester/Dockerfile
    container_name: ${PROJECT_NAME}-backtester
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_HOST=db
      - START_DATE=${START_DATE}
      - END_DATE=${END_DATE}
      - HOLD_DAYS=${HOLD_DAYS}
      - ALLOW_PYRAMIDING=${ALLOW_PYRAMIDING}
      - ONLY_RED_CANDLE=${ONLY_RED_CANDLE}
    # 移除 volumes: - ./backtester:/app，因為這會覆蓋掉 COPY 進去的 strategy
    # 如果要開發模式，需掛載兩個 volume
    volumes:
      - ./backtester:/app/backtester
      - ./strategy:/app/strategy
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=stock_db
      - DB_HOST=db
    # 同樣修正 volume 掛載
    volumes:
      - ./backend:/app/backend
      - ./strategy:/app/strategy

  frontend:
    build:
      context: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: stock_db
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d stock_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    depends_on:
      - db

  validator:
    image: stock-processor
    build:
      context: .
      dockerfile: processor/Dockerfile
    volumes:
      - ./data:/app/data
    command: ["python", "validator.py"]