services:
  scraper:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    volumes:
      - ./data:/app/data
    environment:
      - OUTPUT_DIR=/app/data
      - MARKET_TYPE=${MARKET_TYPE:-ALL}
      - START_DATE=${START_DATE}
      - END_DATE=${END_DATE}
      - FETCH_DELAY=${FETCH_DELAY:-3.0}

  processor:
    build: 
      context: ./processor
    volumes:
      - ./data:/app/data
    environment:
      - START_DATE=${START_DATE}
      - END_DATE=${END_DATE}

  importer:
    build:
      context: ./importer
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=stock_db
      - START_DATE=${START_DATE}
      - END_DATE=${END_DATE}

  frontend:
    build:
      context: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules # 避免本地 node_modules 覆蓋容器內的
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000

  backend:
    build:
      context: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=stock_db

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: stock_db
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d stock_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    depends_on:
      - db


  # 驗證器 (Validator) - 方便單獨執行驗證
  validator:
    image: stock-processor # 重用 processor image
    build:
      context: .
      dockerfile: processor/Dockerfile
    volumes:
      - ./data:/app/data
    command: ["python", "validator.py"]