services:
  # ============================================
  # Scraper Services (依更新頻率分類)
  # ============================================

  # 每日行情 (交易日執行)
  scraper-daily:
    # IMPORTANT:
    # - No code volume mount for /app (scraper code is baked into image).
    # - Any code change under scraper/ requires: docker compose build scraper-daily
    build:
      context: .
      dockerfile: scraper/Dockerfile
    volumes:
      - ./data:/app/data
    command: python scraper/scraper_daily.py
    environment:
      - OUTPUT_DIR=/app/data
      - MARKET_TYPE=${MARKET_TYPE:-ALL}
      - START_DATE=${START_DATE:-}
      - END_DATE=${END_DATE:-}
      - FETCH_DELAY=${FETCH_DELAY:-3.0}
      - TZ=Asia/Taipei

  # 集保股權分散表 (每週日執行)
  scraper-weekly:
    # IMPORTANT:
    # - No code volume mount for /app (scraper code is baked into image).
    # - Any code change under scraper/ requires: docker compose build scraper-weekly
    build:
      context: .
      dockerfile: scraper/Dockerfile
    volumes:
      - ./data:/app/data
    command: python scraper/scraper_weekly.py
    environment:
      - OUTPUT_DIR=/app/data
      - RAW_DIR=/app/data/raw
      - TZ=Asia/Taipei

  # 月營收 (每月 10 日後執行)
  scraper-monthly:
    # IMPORTANT:
    # - No code volume mount for /app (scraper code is baked into image).
    # - Any code change under scraper/ requires: docker compose build scraper-monthly
    build:
      context: .
      dockerfile: scraper/Dockerfile
    volumes:
      - ./data:/app/data
    command: python scraper/scraper_monthly.py
    environment:
      - OUTPUT_DIR=/app/data
      - REVENUE_YEAR=${REVENUE_YEAR:-}
      - REVENUE_MONTH=${REVENUE_MONTH:-}
      - TZ=Asia/Taipei

  # 季報 (每季結束後 45 日執行)
  scraper-quarterly:
    # IMPORTANT:
    # - No code volume mount for /app (scraper code is baked into image).
    # - Any code change under scraper/ requires: docker compose build scraper-quarterly
    build:
      context: .
      dockerfile: scraper/Dockerfile
    volumes:
      - ./data:/app/data
      - ./active_stocks.txt:/app/active_stocks.txt:ro
    command: python scraper/scraper_quarterly.py
    environment:
      - OUTPUT_DIR=/app/data
      - TZ=Asia/Taipei


  # ============================================
  # Processor & Importer
  # ============================================

  processor:
    # IMPORTANT:
    # - No code volume mount for /app (processor code is baked into image).
    # - Any code change under processor/ requires: docker compose build processor
    build:
      context: ./processor
    volumes:
      - ./data:/app/data
      - ./common:/app/common
      - ./error_processor.log:/app/error_processor.log
    environment:
      - START_DATE=${START_DATE:-}
      - END_DATE=${END_DATE:-}
      - FORCE_REPROCESS=${FORCE_REPROCESS:-0}
      - DEBUG=${DEBUG:-0}
      - TZ=Asia/Taipei

  importer:
    # IMPORTANT:
    # - No code volume mount for /app (importer code is baked into image).
    # - Any code change under importer/ requires: docker compose build importer
    build:
      context: ./importer
    volumes:
      - ./data:/app/data
      - ./common:/app/common
      - ./error_importer.log:/app/error_importer.log
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=stock_db
      - START_DATE=${START_DATE:-}
      - END_DATE=${END_DATE:-}
      - TZ=Asia/Taipei

  calculator:
    # IMPORTANT:
    # - No code volume mount for /app (calculator code is baked into image).
    # - Any code change under calculator/ requires: docker compose build calculator
    build: ./calculator
    environment:
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=stock_db
      - DB_HOST=db
      - START_DATE=${START_DATE:-}
      - END_DATE=${END_DATE:-}
      - TZ=Asia/Taipei
    volumes:
      - ./common:/app/common
      - ./error_calculator.log:/error_calculator.log
    depends_on:
      db:
        condition: service_healthy

  backtester:
    build:
      context: .
      dockerfile: backtester/Dockerfile
    environment:
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=stock_db
      - DB_HOST=db
      - START_DATE=${START_DATE:-}
      - END_DATE=${END_DATE:-}
      - HOLD_DAYS=${HOLD_DAYS:-3}
      - ALLOW_PYRAMIDING=${ALLOW_PYRAMIDING:-true}
      - ONLY_RED_CANDLE=${ONLY_RED_CANDLE:-false}
      - TZ=Asia/Taipei
    # 移除 volumes: - ./backtester:/app，因為這會覆蓋掉 COPY 進去的 strategy
    # 如果要開發模式，需掛載兩個 volume
    volumes:
      - ./backtester:/app/backtester
      - ./strategy:/app/strategy
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=stock_db
      - DB_HOST=db
      - TZ=Asia/Taipei
    # 同樣修正 volume 掛載
    volumes:
      - ./backend:/app
      - ./common:/app/common

  frontend:
    build:
      context: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - TZ=Asia/Taipei

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: stock_db
      TZ: Asia/Taipei
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d stock_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
      TZ: Asia/Taipei
    ports:
      - "5050:80"
    depends_on:
      - db

  validator:
    image: my_stock_project-processor-validator
    build:
      context: ./processor
    volumes:
      - ./data:/app/data
      - ./common:/app/common
      - ./error_processor.log:/app/error_processor.log
    environment:
      - TZ=Asia/Taipei
    command: ["python", "validator.py"]
